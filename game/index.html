<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乒乓球游戏 - Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>乒乓球游戏</h1>
        <div class="scoreboard">
            <div class="score">
                <span class="player-label">玩家</span>
                <span class="player-score">0</span>
            </div>
            <div class="score">
                <span class="computer-label">电脑</span>
                <span class="computer-score">0</span>
            </div>
        </div>
        
        <canvas id="pongCanvas" width="800" height="400"></canvas>
        
        <div class="controls">
            <p>控制方式：</p>
            <ul>
                <li>鼠标Y位置 或 上下箭头键 - 控制左侧球拍</li>
                <li>电脑自动控制右侧球拍</li>
            </ul>
            <button id="startBtn">开始游戏</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
